# Nombre del emulador
name = Cannonball

# Descripción del emulador
description = Cannonball

# Sistema emulado
system = 0_Cannonball

# Ruta del emulador ej: c:\mame
directory = 

# Nombre del emulador, ej: mame.exe
executable = cannonball.xex

# Opciones del emulador, ej: -sound 1
global_options = 

# Opciones que van antes de la ROM en el arranque: "yes" o "no".
# ej. yes: "emulator.exe -option1 -option2 rom"
#  no: "emulator.exe rom -option1 -option2"
options_before_rom = no

# Directorio de la ROM
rom_directory = cannonball

# Lista de extensiones compatibles para ROMS (sin el ".")
rom_extension = game

# Es el directorio donde se almacenan las imágenes y la información
assets = assets\cannonball

# Este es el directorio donde se encuentran las capturas de pantalla en formato .png.
screen_shot_directory = assets\cannonball\snap

# Un archivo ROM es una lista de ROMs que se usarán.
# Si se configura en "no", se escanean las ROMs en el directorio de roms.
# Si se configura en "yes", se usa un archivo ROM (que es básicamente una lista de ROMs)
# en lugar de intentar escanearlo. El valor predeterminado es "no". Los archivos ROM son útiles para ROM fusionadas con MAME, donde los nombres reales de las ROM están enterrados dentro de un archivo ZIP.
use_rom_file = no

# Usar la extensión al iniciar el juego: "sí" o "no"
# eg. yes: "emulator.exe rom.ext"
#  no: "emulator.exe rom"
use_extension = yes

# Usar directorio de ROM al iniciar el juego: "sí" o "no"
# ej. yes: "emulator.exe c:\full\path\rom"
#  no: "emulator.exe rom"
use_rom_directory = yes

# Esta es la lista de ROM preescaneadas
map_file = cannonball.map

#Mostrar directorios en el listado
menu_show_directories = no