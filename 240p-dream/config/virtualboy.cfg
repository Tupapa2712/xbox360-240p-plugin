#Emulator Name
name = Virtualboy
#Emulator description
description = Emulador Virtualboy
#Emulated system
system = 11_Virtualboy
#Emulator location, e.g.: c:\mame
directory = 
#Name of the emulator executable, e.g., mame.exe
#More than one emulator can be specified separated by the character: ";". The first one will be the default
executable = beetle-vb.xex
#Global options passed to the emulator, e.g., -sound 1
global_options = 
#ROM Directory
rom_directory = virtualboy
#List of supported extensions for ROMs (without the ".")
rom_extension = zip vb vboy bin
#This is the directory where images and information are stored.
assets = assets\virtualboy
#Instead of loading the title and background from the assets directory, we load them from this path.
#This is useful if, for example, we have many Mame images that are actually the same as those in fbneo.
title_bkg_assets = 
#This is the directory where the screenshots in .png format are located.
screen_shot_directory = assets\virtualboy\snap
#Xml file with Mame game names
mame_roms_xml = 
#This is the list of pre-scanned ROMs (not supported yet).
map_file = virtualboy.map
#Keyboard type. Implemented for: msx and spectrum
keyboard_type = 
#The options appear before the ROM at startup: "yes" o "no".
# ej. yes: emulator.exe -option1 -option2 rom
#     no: emulator.exe rom -option1 -option2
options_before_rom = no
#A ROM file is a list of ROMs to be used.
#If set to "no", the ROMs in the rom directory are scanned.
# If set to "yes", a ROM file (which is basically a list of ROMs) is used
# instead of attempting to scan. The default is "no".
# ROM files are useful for ROMs merged with MAME, where the actual
# ROM names are buried inside a ZIP file.
use_rom_file = no
#Use the extension when starting the game: "yes" or "no"
# e.g., yes: "emulator.exe rom.ext"
# no: "emulator.exe rom"
use_extension = yes
#Use the ROM directory when launching the game: "yes" or "no"
# e.g., yes: "emulator.exe c:\full\path\rom\
# no: "emulator.exe rom"
use_rom_directory = yes
#Avoids to uncompress the zip file
no_uncompress = no
#Show directories in the game list
menu_show_directories = no
#List directory contents recursively
menu_directory_recursive = no
#Select the screen aspect ratio
#AUTO          -1
#RATIO_CORE     0
#RATIO_4_3      1
#RATIO_3_2      2
#RATIO_8_7      3
#RATIO_10_9     4
#RATIO_1_1      5
#RATIO_5_4      6
#RATIO_16_9     7
#RATIO_16_10    8
aspectRatio = -1
#Shader selected
#AUTO                   -1
#SHADER_NEAREST,         0
#SHADER_BILINEAR,        1
#SHADER_BILINEAR_STD,    2
#SHADER_LCD_GRID,        3
#SHADER_SCANLINES,       4
#SHADER_CRT,             5
#SHADER_CRT_LOTTES,      6
#SHADER_CRT_EASYMODE,    7
#SHADER_HQ2X,            8
#SHADER_HQ3X,            9
#SHADER_HQ4X,            10
#SHADER_XBR_LV2_FAST,    11
#SHADER_XBR_HYLLIAN,     12
shaderMode = 
#Scaler in SW mode. Not used
scaleMode = -1
#Enable or disable the screen integer scale
#AUTO                   -1
#DISABLED                0
#ENABLED                 1
integerScale = -1
#Integer screen scale mode used when integerScale is selected
#AUTO                -1
#SCALE INT REDUCE	 0
#SCALE INT INCREASE   1
#SCALE FIXED 1X		 2
#SCALE FIXED 2X		 3
#SCALE FIXED 3X	     4
#SCALE FIXED 4X		 5
#SCALE FIXED 5X		 6
scaleIntMode = -1
