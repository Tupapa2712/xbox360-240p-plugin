#emulators: Sets a list of emulators in the order they will be presented in the frontend.
#each name is the filename of a .cfg file inside the config directory
emulators=genesis megacd 32x master gamegear n64 snes nes gba gameboy virtualboy wonderswan pce pcfx pcecd jaguar 3do psx mame fbn fbn2021 ngp ngp-beetle lynx atari800 atari5200 c64 x68k amiga500 amiga1200 amigacd32 dos msx spectrum prboom quake cannonball
#Enables debug mode
debug=no
#Game screen resolution width (320, 640, 1280 or 1920 for native 240p CRT)
resolution_width=320
#Game screen resolution height (240 for native 240p CRT)
resolution_height=240
#The fullscreen mode or window mode
fullscreen=no
#Path where the .xex or exe files for each core are stored.
#if empty, it will be set to the executable's path
path_prefix=game:\
#The screen aspect ratio
#RATIO_CORE     0
#RATIO_4_3      1
#RATIO_3_2      2
#RATIO_8_7      3
#RATIO_10_9     4
#RATIO_1_1      5
#RATIO_5_4      6
#RATIO_16_9     7
#RATIO_16_10    8
aspectRatio=0
#Specify if the files scraped should be packed in a .bin file (recommended)
packedImages=yes
#Scaler used in SW mode. Not used
scaleMode=0
#Integer screen scale mode used when integerScale is selected
#SCALE INT NATIVE     0
#SCALE INT INCREASE   1
#SCALE FIXED 1X       2
#SCALE FIXED 2X       3
#SCALE FIXED 3X       4
#SCALE FIXED 4X       5
#SCALE FIXED 5X       6
scaleIntMode=0
#Video Synchronization mode
#SYNC_TO_AUDIO	0
#SYNC_TO_VIDEO	1
#SYNC_TO_VIDEO_ADAPT	2
#SYNC_NONE		3
syncMode=1
#Video shader: name of a preset in assets\shaders (without the .hlslp extension).
#If the preset is missing, it falls back to the default one.
shaderMode=00-nearest
#Specify the fast forward nultiplier. Divide it by 10 to have the actual value. 30 = 3x speed
fastForwardMult=30
#Directory where the libretro bios are stored
libretrosystem=game:\system
#Directory to store sram data of games
libretro_save=game:\data\saves
#Directory to store savestates
libretro_state=game:\data\states
#The path usb:\roms automatically scans Usb0, Usb1, and Usb2 for the target directory
#Or Hdd:\roms for the main console hard disk
#Or game:\roms for this directory
roms_path=game:\roms
#Show fps, live output resolution and memory utilization
showFps=yes
#Enable or disable the screen integer scale
integerScale=yes
#Set the frontend background
#Moving tiles        0
#Images              1
#Plasma hlsl         2
#Purple drop hlsl    3
#Wormholes hlsl      4
#none                5
animBG=1
#Menu music volume, in 10% steps
#0 = mute ... 10 = 100%
musicVolume=7
#Enable or disable the menu music completely
musicEnabled=yes
#Menu music file, relative to the app directory.
#Used when the active core does not define its own 'music_file'.
#Leave empty for no music.
musicFile=assets\music\menu.mp3
#Enable the built-in General MIDI synthesizer.
#Needs a .sf2 SoundFont in the system directory; without one it stays off.
midiEnabled=yes
#Index of the .sf2 SoundFont to use, from the ones found
#in the system directory (0 = none).
#Keep it small on Xbox 360: samples are expanded to float,
#so a bank takes about twice its file size in RAM.
midiSoundfont=2
#MIDI synthesizer volume, in 10% steps
#0 = mute ... 10 = 100%
midiVolume=8
#MIDI module the game expects.
#0 = auto-detect from the reset SysEx the core sends
#1 = General MIDI
#2 = Roland MT-32 / LA (translates MT-32 programs to GM)
midiModule=0
#mainLang: Main system lang. If not specified on xbox 360, it will try to find the configured
#from the console with some of this values: es, en, fr, de, it (although only 'es' and 'en' are actually supported)
mainLang=es
#Region for the artwork scraper
scrapRegion=eu
#Language for the artwork scraper
scrapLang=es
#scrapOrigin: Sets the scraper source
#screenscraper.fr 	0
#thegamesdb			1
scrapOrigin=0
#Username for screenscraper.fr
scrapUser=
#Password for screenscraper.fr
scrapPass=
#Api key for thegamesdb
apikey.tgdb=
#retroachievements username
raUser=
#retroachievements password
raPass=
#Enable retroachievements
enableAchievements=yes
#hardcoreRA: Sets the hardcore mode for retroachievements -> Not validated yet to use from the retroachievements team :(
hardcoreRA=no
#Set to 'no' to hide emulators without games
showEmptyEmulators=yes
#Sets the frontend overscan to enlarge or shrink the x axis of the frontend screen
#It doesn't affect the game screen
overscan_x=0
#Sets the frontend overscan to enlarge or shrink the y axis of the frontend screen
#It doesn't affect the game screen
overscan_y=0
#Game CRT 240p mode index (0=320x240, 1=640x240, 2=1280x240, 3=1920x240)
resolutionIndex=0
#Enable or disable the lightgun crosshair when selected
lightgunCrossEnabled=yes
#Set the size of the lightgun crosshair
lightgunCrossSize=0
#Set the thickness of the lightgun crosshair
lightgunThickness=1
#Visual UI theme (0=Frutiger Aero, 1=Crystal Ice, 2=Ocean 240p, 3=Classic)
uiTheme=0
